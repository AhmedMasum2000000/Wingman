name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub release with this version (for example 0.1.0). Leave empty to only build."
        required: false
        default: ""
      prerelease:
        description: "Publish as a beta (pre-release). The 'latest' download links keep pointing at the last full release."
        type: boolean
        required: false
        default: true
      notes:
        description: "What's new in this version, in a sentence or two. M1D1's update dialog shows it."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the WebView2 SDK (the M1D1 window is a WebView2 page)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'nuget'
          $pkg = Join-Path $dir 'Microsoft.Web.WebView2.1.0.1901.177'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # two addresses for the same package, a few tries each (a runner's name lookup sometimes fails for a while)
          $urls = @('https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.1901.177/microsoft.web.webview2.1.0.1901.177.nupkg',
                    'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177')
          $got = $false
          foreach ($try in 1..4) {
            foreach ($u in $urls) {
              try { Invoke-WebRequest $u -OutFile (Join-Path $dir 'webview2.zip'); $got = $true; break } catch { Write-Host "Try $try, $u : $($_.Exception.Message)" }
            }
            if ($got) { break }
            Start-Sleep -Seconds (10 * $try)
          }
          if (-not $got) { throw 'Could not download the WebView2 SDK from NuGet' }
          # the package's own checksum: the same bytes whichever address answered
          $sha = (Get-FileHash (Join-Path $dir 'webview2.zip') -Algorithm SHA512).Hash
          Write-Host "WebView2 SDK package SHA-512: $sha"
          Expand-Archive (Join-Path $dir 'webview2.zip') -DestinationPath $pkg -Force
          if (-not (Test-Path (Join-Path $pkg 'build\native\include\WebView2.h'))) { throw 'WebView2 SDK not found in the package' }
          "WEBVIEW2_DIR=$($dir -replace '\\','/')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # a release compiles its full version into M1D1 (CMake stops if it differs from the project version)
          $extra = @()
          if ($env:RELEASE_VERSION) {
            if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Not a version: $env:RELEASE_VERSION (use 0.4.3 or 0.5.0-beta.1)" }
            $extra += "-DM1D1_VERSION_STRING=$env:RELEASE_VERSION"
          }
          cmake -S . -B build -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ env.WEBVIEW2_DIR }}" @extra
          if ($LASTEXITCODE) { throw "CMake configure failed ($LASTEXITCODE)" }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test the analyser and the generator (the plugin page's JavaScript)
        shell: bash
        run: |
          cd web/src
          node test-gen.js
          node test-listen.js
          node test-grid.js
          node test-grid2.js

      - name: Validate the VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip -opluginval > /dev/null
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process \
            --validate "build/Backline_artefacts/Release/VST3/M1D1.vst3"

      - name: Package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="$RELEASE_VERSION"
          if [ -z "$version" ]; then version=$(sed -n 's/^project(Backline VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt); fi
          mkdir -p dist/M1D1
          cp -r build/Backline_artefacts/Release/VST3/M1D1.vst3 dist/M1D1/
          cp build/Backline_artefacts/Release/Standalone/M1D1.exe dist/M1D1/
          cp installer/Install.bat installer/Uninstall.bat installer/README.txt dist/M1D1/
          # the licences: M1D1's own, the third-party notices, and the licence and notice files from third_party/
          # (not its model or runtime files, which are inside the plugin and the app)
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/M1D1/
          mkdir -p dist/M1D1/licenses
          cp -r licenses/. dist/M1D1/licenses/
          for f in basic-pitch/LICENSE basic-pitch/NOTICE nnAudio/LICENSE onnxruntime-web/LICENSE onnxruntime-web/ThirdPartyNotices.txt; do
            mkdir -p "dist/M1D1/licenses/$(dirname "$f")"
            cp "third_party/$f" "dist/M1D1/licenses/$f"
          done
          printf '%s\r\n' "$version" > dist/M1D1/version.txt
          cd dist && 7z a -tzip ../M1D1-Windows.zip M1D1 > /dev/null

      - name: Test the one-line install script
        shell: pwsh
        run: |
          $env:M1D1_ZIP = "$PWD\M1D1-Windows.zip"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\install.ps1
          if ($LASTEXITCODE) { throw "install.ps1 failed with $LASTEXITCODE" }
          $plugin = Join-Path $env:CommonProgramFiles 'VST3\M1D1.vst3\Contents\x86_64-win\M1D1.vst3'
          if (-not (Test-Path $plugin)) { throw "Plugin was not installed to $plugin" }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'M1D1\M1D1.exe'))) { throw 'Standalone app was not installed' }
          Write-Host 'install.ps1 works.'

      - name: Test Install.bat from a folder with spaces, replacing an old Backline install
        shell: pwsh
        run: |
          $vst = Join-Path $env:CommonProgramFiles 'VST3'
          Remove-Item (Join-Path $vst 'M1D1.vst3') -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $vst 'Backline.vst3\Contents') | Out-Null
          $folder = Join-Path $PWD 'unzip test (1)'
          Expand-Archive M1D1-Windows.zip -DestinationPath $folder
          $env:M1D1_QUIET = '1'
          cmd /c "`"$folder\M1D1\Install.bat`" < NUL"
          if ($LASTEXITCODE) { throw "Install.bat failed with $LASTEXITCODE" }
          $app = Join-Path $env:ProgramFiles 'M1D1'
          $checks = @{
            'plugin'           = Test-Path (Join-Path $vst 'M1D1.vst3\Contents\x86_64-win\M1D1.vst3')
            'old Backline gone' = -not (Test-Path (Join-Path $vst 'Backline.vst3'))
            'app'              = Test-Path (Join-Path $app 'M1D1.exe')
            'uninstaller'      = Test-Path (Join-Path $app 'Uninstall.bat')
            'licence texts'    = (Test-Path (Join-Path $app 'LICENSE.txt')) -and (Test-Path (Join-Path $app 'THIRD_PARTY_NOTICES.txt')) -and (Test-Path (Join-Path $app 'licenses\basic-pitch\NOTICE'))
            'Start menu'       = Test-Path (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'M1D1.lnk')
            'Apps entry'       = Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\M1D1'
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("{0,-18} {1}" -f $_.Key, $_.Value) }
          if ($checks.Values -contains $false) { throw 'Install.bat did not install everything' }
          $version = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\M1D1').DisplayVersion
          Write-Host "Registered version $version"
          if (-not $version -or $version -eq '0.0.0') { throw 'Version was not registered' }
          Write-Host 'Install.bat works.'

      - name: Ask GitHub for the latest release, as M1D1 does
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $env:M1D1_UPDATE_DIR = Join-Path $env:RUNNER_TEMP 'update-real'
          $out = & build\m1d1_update_tool_artefacts\Release\m1d1_update_tool.exe check
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $text = $out -join "`n"
          if ($code -eq 2 -and $text -match 'GitHub is busy|No connection|HTTP 5') { Write-Host "::warning::GitHub could not be asked now; the live check was skipped."; exit 0 }
          if ($code -ne 0) { throw "The update check failed ($code)" }
          $field = { param($name) (($out | Where-Object { $_ -like "$name=*" }) -replace "^$name=", '') }
          # M1D1 reports the version this build packages
          $built = (Get-Content dist\M1D1\version.txt -Raw).Trim()
          if ((& $field 'current') -ne $built) { throw "M1D1 reports $(& $field 'current') but the package is $built" }
          # and it heard the same latest full release as GitHub's own API
          $tag = ''
          $tag = gh api "repos/$env:REPO/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE) { $tag = '' }
          $want = ($tag -replace '^v', '')
          Write-Host "GitHub's latest full release: '$tag'"
          if ((& $field 'latest') -ne $want) { throw "M1D1 read latest='$(& $field 'latest')', GitHub says '$want'" }
          if ((& $field 'state') -notin 'upToDate', 'available') { throw "Unexpected state $(& $field 'state')" }
          Write-Host 'M1D1 reads the live release answer correctly.'

      - name: Test the updater end to end (a newer release served from this machine)
        shell: pwsh
        run: |
          # a release 9.9.9: the package just built, with its version changed
          $root = Join-Path $env:RUNNER_TEMP 'fake-release'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive M1D1-Windows.zip -DestinationPath (Join-Path $root 'src') -Force
          Set-Content -Path (Join-Path $root 'src\M1D1\version.txt') -Value '9.9.9' -NoNewline
          Compress-Archive -Path (Join-Path $root 'src\M1D1') -DestinationPath (Join-Path $root 'M1D1-Windows.zip') -Force
          $zip = Get-Item (Join-Path $root 'M1D1-Windows.zip')
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          @{ tag_name = 'v9.9.9'; name = 'M1D1 9.9.9'; draft = $false; prerelease = $false
             html_url = 'https://github.com/AhmedMasum2000000/Wingman/releases/tag/v9.9.9'; body = "A test release.`n`n---`nInstall"
             assets = @(@{ name = 'M1D1-Windows.zip'; browser_download_url = 'http://127.0.0.1:8765/M1D1-Windows.zip'; size = $zip.Length; digest = "sha256:$sha" }) } |
            ConvertTo-Json -Depth 5 | Set-Content (Join-Path $root 'latest.json')
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $root -PassThru -WindowStyle Hidden
          $log = Join-Path ([IO.Path]::GetTempPath()) 'M1D1-update-test.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          try {
            # wait until the server answers
            $deadline = (Get-Date).AddSeconds(30)
            while ($true) {
              try { Invoke-WebRequest 'http://127.0.0.1:8765/latest.json' -UseBasicParsing -TimeoutSec 2 | Out-Null; break } catch {}
              if ((Get-Date) -gt $deadline) { throw 'The test server did not start' }
              Start-Sleep -Milliseconds 300
            }
            $env:M1D1_UPDATE_API = 'http://127.0.0.1:8765/latest.json'
            $env:M1D1_UPDATE_DIR = Join-Path $env:RUNNER_TEMP 'update-settings'
            $env:M1D1_QUIET = '1'
            $out = & build\m1d1_update_tool_artefacts\Release\m1d1_update_tool.exe update
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code) { throw "The updater did not get the update ready ($code)" }
            $folder = (($out | Where-Object { $_ -like 'folder=*' }) | Select-Object -Last 1) -replace '^folder=', ''
            # the "M1D1 update" window installs it with the package's own Install.bat; it logs its exit code
            $deadline = (Get-Date).AddMinutes(4)
            do { Start-Sleep -Seconds 2; $done = (Test-Path $log) -and ((Get-Content $log -Raw) -match 'M1D1-UPDATE-EXIT (\d+)') } until ($done -or (Get-Date) -gt $deadline)
            if (Test-Path $log) { Write-Host '--- M1D1 update window ---'; Get-Content $log | ForEach-Object { Write-Host $_ } }
            if (-not $done) { throw 'The M1D1 update window did not finish' }
            if ($Matches[1] -ne '0') { throw "The M1D1 update window ended with code $($Matches[1])" }
          } finally { Stop-Process $server -ErrorAction SilentlyContinue }
          $v = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\M1D1').DisplayVersion
          Write-Host "Registered version after the update: $v"
          if ($v -ne '9.9.9') { throw 'The update did not install' }
          $app = (Get-Content (Join-Path $env:ProgramFiles 'M1D1\version.txt') -Raw).Trim()
          if ($app -ne '9.9.9') { throw "Program Files holds version $app" }
          if (-not (Test-Path (Join-Path $env:CommonProgramFiles 'VST3\M1D1.vst3\Contents\x86_64-win\M1D1.vst3'))) { throw 'The plugin is missing after the update' }
          $deadline = (Get-Date).AddSeconds(20)
          while ($folder -and (Test-Path $folder) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if ($folder -and (Test-Path $folder)) { throw "The downloaded update was not cleaned up: $folder" }
          Write-Host 'The updater downloads, checks and installs a new version (the already-administrator path; users see one Windows permission prompt instead).'

      - name: Test Uninstall.bat from the install folder
        shell: pwsh
        run: |
          $app = Join-Path $env:ProgramFiles 'M1D1'
          $env:M1D1_QUIET = '1'
          cmd /c "`"$app\Uninstall.bat`" < NUL"
          Start-Sleep -Seconds 2
          $left = @(
            (Join-Path $env:CommonProgramFiles 'VST3\M1D1.vst3'),
            $app,
            (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'M1D1.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'M1D1.lnk'),
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\M1D1',
            (Join-Path $env:TEMP 'M1D1-uninstall.bat')
          ) | Where-Object { Test-Path $_ }
          if ($left) { throw "Uninstall left behind: $($left -join ', ')" }
          Write-Host 'Uninstall.bat removes everything.'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: M1D1-Windows
          path: dist

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: M1D1 ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
          body: |
            ${{ inputs.notes }}

            ---
            M1D1 for Windows (64-bit), a plugin by ACND: VST3 plugin, standalone app, installer and uninstaller.

            **Install from Command Prompt**
            ```
            powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://github.com/AhmedMasum2000000/Wingman/releases/latest/download/install.ps1 | iex"
            ```
            Or download `M1D1-Windows.zip`, unzip it and double-click `Install.bat`. To remove it, use Settings > Apps > M1D1, or `Uninstall.bat`.

            The files are not code-signed, so Windows may show an "unknown publisher" warning.
            M1D1 0.4.2 and later find new versions on their own: the version next to the logo turns into UPDATE.
          files: |
            M1D1-Windows.zip
            installer/install.ps1
