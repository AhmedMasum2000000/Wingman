name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub release with this version (for example 0.1.0). Leave empty to only build."
        required: false
        default: ""
      prerelease:
        description: "Publish as a beta (pre-release). The 'latest' download links keep pointing at the last full release."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate the VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip -opluginval > /dev/null
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process \
            --validate "build/Backline_artefacts/Release/VST3/Backline.vst3"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/Backline
          cp -r build/Backline_artefacts/Release/VST3/Backline.vst3 dist/Backline/
          cp build/Backline_artefacts/Release/Standalone/Backline.exe dist/Backline/
          cp installer/Install.bat installer/README.txt dist/Backline/
          cd dist && 7z a -tzip ../Backline-Windows.zip Backline > /dev/null

      - name: Test the install script
        shell: pwsh
        run: |
          $env:BACKLINE_ZIP = "$PWD\Backline-Windows.zip"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\install.ps1
          $plugin = Join-Path $env:CommonProgramFiles 'VST3\Backline.vst3\Contents\x86_64-win\Backline.vst3'
          if (-not (Test-Path $plugin)) { throw "Plugin was not installed to $plugin" }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'Backline\Backline.exe'))) { throw 'Standalone app was not installed' }
          Write-Host 'Install script works.'

      - name: Test Install.bat from a folder with spaces
        shell: pwsh
        run: |
          $plugin = Join-Path $env:CommonProgramFiles 'VST3\Backline.vst3'
          Remove-Item $plugin -Recurse -Force
          $folder = Join-Path $PWD 'unzip test (1)'
          Expand-Archive Backline-Windows.zip -DestinationPath $folder
          cmd /c "`"$folder\Backline\Install.bat`" < NUL"
          if (-not (Test-Path (Join-Path $plugin 'Contents\x86_64-win\Backline.vst3'))) { throw 'Install.bat did not install the plugin' }
          Write-Host 'Install.bat works.'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Backline-Windows
          path: dist

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Backline ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
          body: |
            Backline for Windows (64-bit): VST3 plugin and standalone app.

            **Install from Command Prompt**
            ```
            powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://github.com/AhmedMasum2000000/Wingman/releases/latest/download/install.ps1 | iex"
            ```
            Or download `Backline-Windows.zip`, unzip it and double-click `Install.bat`.

            The files are not code-signed, so Windows may show an "unknown publisher" warning.
          files: |
            Backline-Windows.zip
            installer/install.ps1
